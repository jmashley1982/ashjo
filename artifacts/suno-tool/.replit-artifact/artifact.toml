kind = "web"
previewPath = "/suno-tool"
title = "Suno Prompt Tool"
version = "1.0.0"
id = "artifacts/suno-tool"

[[services]]
name = "Suno Tool"
paths = ["/suno-tool"]
localPort = 8082

[services.env]
PORT = "8082"
BASE_PATH = "/suno-tool"

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/suno-tool && pip install -q -r requirements.txt && python3 app.py'"

[services.production]

[services.production.build]
args = ["bash", "-c", "cd /home/runner/workspace/artifacts/suno-tool && python3 -m venv .venv && PIP_USER=0 .venv/bin/pip install -r requirements.txt"]

[services.production.run]
args = ["/home/runner/workspace/artifacts/suno-tool/.venv/bin/gunicorn", "--chdir", "/home/runner/workspace/artifacts/suno-tool", "--bind", "0.0.0.0:8082", "--workers", "2", "app:app"]

[services.production.run.env]
PORT = "8082"
BASE_PATH = "/suno-tool"
